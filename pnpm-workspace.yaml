packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true

catalog:
  typescript: 7.0.2
  prettier: 3.9.6
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19
  "@types/react-dom": ^19
  "@vitejs/plugin-react": ^6
  zod: 4.6.7
  "@agentclientprotocol/sdk": 2.1.0
  fastify: 5.12.7
  "@fastify/type-provider-zod": 1.0.3
  "@fastify/websocket": 11.3.4
  ws: 8.22.0
  "@types/ws": 8.18.2
  "@types/node": ^24.10.0
  tsx: 4.23.15
  vitest: 5.0.5
  vite: 8.3.5
  eslint: 10.9.1
  "@eslint/js": 10.0.1
  typescript-eslint: 8.72.1
  eslint-config-prettier: 10.1.8
  globals: 17.13.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7

peerDependencyRules:
  allowedVersions:
    typescript: "7"

onlyBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.108.1"
  - "@tanstack/react-query@5.108.1"
  - "@tanstack/devtools-vite@0.8.7"
  - "@tanstack/devtools@0.17.0"
  - "@tanstack/query-devtools@5.108.1"
  - "@tanstack/react-devtools@0.10.15"
  - "@tanstack/react-query-devtools@5.108.1"
  - "@tanstack/react-router-devtools@1.167.4"
  - "@tanstack/router-devtools-core@1.168.4"
